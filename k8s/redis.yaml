apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-redis
  namespace: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiapx-redis
  template:
    metadata:
      labels:
        app: fiapx-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fiapx-redis
  namespace: fiapx
spec:
  selector:
    app: fiapx-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
