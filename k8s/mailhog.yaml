apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-mailhog
  namespace: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiapx-mailhog
  template:
    metadata:
      labels:
        app: fiapx-mailhog
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - containerPort: 1025
            - containerPort: 8025
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fiapx-mailhog
  namespace: fiapx
spec:
  selector:
    app: fiapx-mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: web
      port: 8025
      targetPort: 8025
