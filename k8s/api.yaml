apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-api
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiapx-api
  template:
    metadata:
      labels:
        app: fiapx-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/fiapx/fiapx-api:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: NODE_ENV
            - name: API_GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: API_GATEWAY_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: REDIS_PORT
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: UPLOAD_DIR
            - name: OUTPUT_DIR
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: OUTPUT_DIR
            - name: TEMP_DIR
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: TEMP_DIR
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: SMTP_PORT
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: SMTP_FROM
            - name: DD_TRACE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: DD_TRACE_ENABLED
            - name: DD_ENV
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: DD_ENV
            - name: DD_VERSION
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: DD_VERSION
            - name: DD_LOGS_INJECTION
              valueFrom:
                configMapKeyRef:
                  name: fiapx-config
                  key: DD_LOGS_INJECTION
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: JWT_SECRET
            - name: DD_SERVICE
              value: fiapx-api
            - name: VIDEO_PROCESSOR_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fiapx-api
  namespace: fiapx
spec:
  selector:
    app: fiapx-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
