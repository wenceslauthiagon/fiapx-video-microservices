name: Root API CD (main)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build

      - name: Build Docker image
        run: docker build -f Dockerfile -t fiapx-api:latest .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Detect Terraform directories
        id: tf-detect
        shell: bash
        run: |
          tf_dirs=$(find . -type f -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u)
          if [ -z "$tf_dirs" ]; then
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform files found."
            exit 0
          fi

          echo "has_tf=true" >> "$GITHUB_OUTPUT"
          {
            echo "tf_dirs<<EOF"
            echo "$tf_dirs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform fmt check
        if: steps.tf-detect.outputs.has_tf == 'true'
        shell: bash
        run: terraform fmt -check -recursive

      - name: Terraform validate
        if: steps.tf-detect.outputs.has_tf == 'true'
        shell: bash
        run: |
          while IFS= read -r dir; do
            echo "Validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
          done <<< "${{ steps.tf-detect.outputs.tf_dirs }}"

      - name: TFLint
        if: steps.tf-detect.outputs.has_tf == 'true'
        shell: bash
        run: |
          tflint --init
          while IFS= read -r dir; do
            echo "Linting $dir"
            tflint --chdir="$dir"
          done <<< "${{ steps.tf-detect.outputs.tf_dirs }}"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: terraform

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fiapx_videos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Setup database schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fiapx_videos_test
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run backend linter
        run: npm run lint

      - name: Run tests
        run: npm run test:cov

      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fiapx_videos_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret
          VIDEO_PROCESSOR_ENABLED: "false"
        run: npm run test:e2e

  datadog-readiness:
    name: Datadog readiness
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Validate Datadog bootstrap file
        run: test -f dd-trace-init.js

      - name: Validate Datadog config file
        run: test -f src/observability/datadog.config.ts

  deploy:
    name: Deploy
    needs:
      - tests
      - datadog-readiness
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      K8S_NAMESPACE: fiapx

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_BASE64 }}" ]; then
            echo "KUBE_CONFIG_BASE64 secret is required for deploy"
            exit 1
          fi
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 --decode > $HOME/.kube/config

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/
          kubectl -n $K8S_NAMESPACE set image deployment/fiapx-api api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl -n $K8S_NAMESPACE set image deployment/fiapx-worker worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl -n $K8S_NAMESPACE rollout status deployment/fiapx-api --timeout=180s
          kubectl -n $K8S_NAMESPACE rollout status deployment/fiapx-worker --timeout=180s

      - name: Health check
        run: kubectl -n $K8S_NAMESPACE get pods
