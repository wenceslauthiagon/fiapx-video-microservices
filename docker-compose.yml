services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fiapx-postgres
    environment:
      POSTGRES_DB: fiapx_videos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_BIND_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for queues and caching
  redis:
    image: redis:7-alpine
    container_name: fiapx-redis
    ports:
      - "${REDIS_BIND_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog for development (SMTP + Web UI)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: fiapx-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MH_STORAGE: memory
      MH_MAILDIR_OUTGOING_WAIT: 5s

  # API (NestJS)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapx-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fiapx_videos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_OPTIONS: --require ./dd-trace-init.js
      DD_TRACE_ENABLED: "true"
      DD_ENV: development
      DD_SERVICE: fiapx-api
      DD_VERSION: "1.0.0"
      DD_LOGS_INJECTION: "true"
      JWT_SECRET: your-super-secret-key-change-this-in-production
      JWT_EXPIRATION: 7d
      API_GATEWAY_PORT: 3001
      UPLOAD_DIR: /app/uploads
      OUTPUT_DIR: /app/outputs
      TEMP_DIR: /app/temp
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@fiapx.local}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:3001/auth/reset-password}
      NODE_ENV: development
      VIDEO_PROCESSOR_ENABLED: "false"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker dedicado para processamento de videos
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapx-worker
    command: ["dist/main.worker.js"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fiapx_videos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_OPTIONS: --require ./dd-trace-init.js
      DD_TRACE_ENABLED: "true"
      DD_ENV: development
      DD_SERVICE: fiapx-worker
      DD_VERSION: "1.0.0"
      DD_LOGS_INJECTION: "true"
      OUTPUT_DIR: /app/outputs
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@fiapx.local}
      NODE_ENV: development
      VIDEO_PROCESSOR_ENABLED: "true"
      VIDEO_WORKER_CONCURRENCY: 3
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend (Vite)
  frontend:
    image: node:22-alpine
    container_name: fiapx-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"
    environment:
      VITE_API_BASE_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - "4173:4173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: fiapx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: fiapx-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: fiapx-network
